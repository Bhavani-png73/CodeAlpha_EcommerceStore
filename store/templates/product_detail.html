<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }} - My E-Commerce Store</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 0;
        }

        .navbar {
            background-color: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .product-detail {
            width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .stock {
            color: green;
            margin: 15px 0;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        .back {
            background-color: #555;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>My E-Commerce Store</h2>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
    </div>
</div>

<div class="product-detail">
    {% if product.image %}
       <img src="{{ product.image }}"
         alt="{{ product.name }}"
         style="width: 300px; height: 300px; object-fit: contain; display: block; margin: 0 auto 20px;">
{% endif %}

    <h1>{{ product.name }}</h1>

    <p class="description">
        {{ product.description }}
    </p>

    <p class="price">
        ₹{{ product.price }}
    </p>

    <p>
        <strong>Category:</strong> {{ product.category }}
    </p>

    <p class="stock">
        Stock: {{ product.stock }}
    </p>

  {% if product.stock > 0 %}
    <a href="{% url 'add_to_cart' product.id %}" class="btn">
        Add to Cart
    </a>
{% else %}
    <span style="color: red; font-weight: bold;">
        Out of Stock
    </span>
{% endif %}

    <a href="{% url 'home' %}" class="btn back">
        Back to Products
    </a>

</div>

</body>
</html>
