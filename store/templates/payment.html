<!DOCTYPE html>
<html>
<head>
    <title>Payment - My E-Commerce Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 25px 50px;
        }

        .navbar h1 {
            display: inline;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
        }

        .total {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 25px 0;
        }

        .payment-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
    background: #fff;
}

.payment-option:hover {
    background: #f5f5f5;
}

.payment-option input {
    width: auto;
    margin: 0;
}

        button {
            width: 100%;
            padding: 14px;
            background: #087fef;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #066dcc;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>My E-Commerce Store</h1>

        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'my_orders' %}">My Orders</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <div class="container">

        <h2>Choose Payment Method</h2>

        <div class="total">
            Total Amount: ₹{{ grand_total }}
        </div>

        <form method="POST">
            {% csrf_token %}

            <label class="payment-option">
                <input type="radio" name="payment_method" value="COD" required>
                💵 Cash on Delivery
            </label>

            <label class="payment-option">
                <input type="radio" name="payment_method" value="UPI">
                📱 UPI Payment
            </label>

            <label class="payment-option">
                <input type="radio" name="payment_method" value="CARD">
                💳 Card Payment
            </label>

            <button type="submit">
                Confirm Payment
            </button>
        </form>

        <a href="{% url 'checkout' %}" class="back">
            ← Back to Checkout
        </a>

    </div>

</body>
</html>
