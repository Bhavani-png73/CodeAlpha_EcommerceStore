<!DOCTYPE html>
<html>
<head>
    <title>Payment - My E-Commerce Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #222;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
        }

        .total {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .option {
            display: block;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            cursor: pointer;
            font-size: 18px;
        }

        .option:hover {
            background: #f5f5f5;
        }

        .option input {
            margin-right: 12px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #1683e8;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0d6ec7;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #222;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h1>My E-Commerce Store</h1>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'cart' %}">🛒 Cart</a>
        <a href="{% url 'my_orders' %}">📦 My Orders</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

</div>


<div class="container">

    <h2>Choose Payment Method</h2>

    <div class="total">
        Total Amount: ₹{{ grand_total }}
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <!-- THIS FORM IS IMPORTANT -->
    <form method="POST" action="{% url 'payment' %}">

        {% csrf_token %}

        <label class="option">
            <input type="radio"
                    name="payment_method"
                    value="Cash on Delivery"
                    required
                    checked>
            💵 Cash on Delivery
        </label>

        <label class="option">
            <input type="radio"
                   name="payment_method"
                   value="UPI Payment">
            📱 UPI Payment
        </label>

        <label class="option">
            <input type="radio"
                   name="payment_method"
                   value="Card Payment">
            💳 Card Payment
        </label>

        <button type="submit">
            Confirm Payment
        </button>

    </form>

    <a class="back" href="{% url 'checkout' %}">
        ← Back to Checkout
    </a>

</div>

</body>
</html>
