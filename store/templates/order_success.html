<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            margin: 0;
            font-size: 30px;
        }

        nav div {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        nav a:hover {
            color: #00aaff;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        .success {
            color: #20a83a;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .details {
            background-color: #f7f7f7;
            padding: 25px;
            border-radius: 10px;
            font-size: 18px;
            line-height: 2;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            background-color: #087ff5;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 17px;
        }

        .back:hover {
            background-color: #0668c9;
        }
    </style>
</head>

<body>

    <nav>
        <h1>My E-Commerce Store</h1>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'cart' %}">Cart</a>

            {% if user.is_authenticated %}
                <a href="{% url 'my_orders' %}">My Orders</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">

        <h2 class="success">
            ✓ Order Placed Successfully!
        </h2>

        <div class="details">

            <h3>Customer Details</h3>

            <p>
                <strong>Name:</strong>
                {{ name }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ phone }}
            </p>

            <p>
                <strong>Address:</strong>
                {{ address }}
            </p>

            <p>
                <strong>Order Total:</strong>
                ₹{{ grand_total }}
            </p>

        </div>

        <a href="{% url 'home' %}" class="back">
            Back to Home
        </a>

    </div>

</body>
</html>
